<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="description" content="Page not found — return to the Voice AI Agent Templates gallery." />
    <meta name="theme-color" content="#ffffff" />
    <title>Page not found — Voice AI Agent Templates</title>
    <link rel="icon" href="/voice-ai-template-gallery/favicon.svg" type="image/svg+xml" />
    <!-- Styles are inlined: GitHub Pages serves this file for *any* missing -->
    <!-- path, so a relative stylesheet link would break at nested depths. -->
    <!-- The tokens repeat the gallery's (docs/assets/gallery.css). -->
    <style>
      :root {
        color-scheme: light;
        --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display",
          "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
        --font-text: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text",
          "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
        --ink: #1d1d1f;
        --ink-2: #6e6e73;
        --blue: #0071e3;
        --blue-hover: #0077ed;
        --gradient-light: linear-gradient(90deg, #2f6fff, #7a4dff 40%, #c13fd6 70%, #f2603a);
        --ease: cubic-bezier(0.25, 1, 0.5, 1);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #fff;
        color: var(--ink);
        font-family: var(--font-text);
        font-size: 17px;
        line-height: 1.47;
        letter-spacing: -0.01em;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      :focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 3px;
      }
      .not-found {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: 100svh;
        padding: 64px 22px;
        text-align: center;
      }
      .voice-mark {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 44px;
        margin-bottom: 24px;
      }
      .voice-mark i {
        display: block;
        width: 8px;
        border-radius: 4px;
      }
      .voice-mark i:nth-child(1) {
        height: 25%;
        background: #3a6aff;
      }
      .voice-mark i:nth-child(2) {
        height: 65%;
        background: #7050ff;
      }
      .voice-mark i:nth-child(3) {
        height: 100%;
        background: #b542dd;
      }
      .voice-mark i:nth-child(4) {
        height: 45%;
        background: #e6584f;
      }
      .code {
        font-family: var(--font-display);
        font-size: clamp(104px, 22vw, 208px);
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.05em;
      }
      @supports ((-webkit-background-clip: text) or (background-clip: text)) {
        .code {
          background-image: var(--gradient-light);
          -webkit-background-clip: text;
          background-clip: text;
          color: transparent;
          -webkit-text-fill-color: transparent;
        }
      }
      h1 {
        margin: 12px 0 0;
        font-family: var(--font-display);
        font-size: clamp(28px, 4vw, 40px);
        font-weight: 700;
        line-height: 1.1;
        letter-spacing: -0.025em;
      }
      .lede {
        max-width: 32rem;
        margin: 16px 0 0;
        color: var(--ink-2);
        font-size: 19px;
        line-height: 1.42;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        margin-top: 32px;
        padding: 0 22px;
        border-radius: 980px;
        background: var(--blue);
        color: #fff;
        font-size: 17px;
        letter-spacing: -0.02em;
        text-decoration: none;
        transition: background-color 0.2s var(--ease), transform 0.2s var(--ease);
      }
      .pill:hover {
        background: var(--blue-hover);
      }
      .pill:active {
        transform: scale(0.97);
      }
      @media (prefers-reduced-motion: no-preference) {
        .code,
        h1,
        .lede,
        .pill {
          animation: arrive 0.9s var(--ease) both;
        }
        h1 {
          animation-delay: 0.1s;
        }
        .lede {
          animation-delay: 0.2s;
        }
        .pill {
          animation-delay: 0.3s;
        }
        /* The mark rises, then speaks three times and rests, as in the gallery. */
        .voice-mark i {
          animation: bar-in 0.7s var(--ease) both, speak 1.1s ease-in-out 0.9s 3;
        }
        .voice-mark i:nth-child(2) {
          animation-delay: 0.06s, 1.02s;
        }
        .voice-mark i:nth-child(3) {
          animation-delay: 0.12s, 1.14s;
        }
        .voice-mark i:nth-child(4) {
          animation-delay: 0.18s, 1.26s;
        }
      }
      @keyframes arrive {
        from {
          opacity: 0;
          filter: blur(12px);
          transform: translateY(24px);
        }
      }
      @keyframes bar-in {
        from {
          opacity: 0;
          transform: scaleY(0.2);
        }
      }
      @keyframes speak {
        0%,
        100% {
          transform: scaleY(1);
        }
        30% {
          transform: scaleY(0.55);
        }
        65% {
          transform: scaleY(1.12);
        }
      }
      @media (forced-colors: active) {
        .code {
          background: none;
          color: CanvasText;
          -webkit-text-fill-color: CanvasText;
        }
        .voice-mark i {
          background: CanvasText;
        }
        .pill {
          border: 1px solid ButtonText;
        }
      }
    </style>
  </head>
  <body>
    <main class="not-found">
      <div class="voice-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="code" aria-hidden="true">404</div>
      <h1>Page not found</h1>
      <p class="lede">
        That page doesn't exist or may have moved. Head back to the
        catalogue to browse all voice AI agent templates.
      </p>
      <a class="pill" id="galleryLink" href="./index.html">Back to the gallery</a>
    </main>
    <script>
      /* GitHub Pages serves this file for any missing path, so "./index.html"
         is only correct at the site root. Walk up a few levels and use the
         first one that actually resolves; the static href stays as-is if
         nothing resolves (or scripting is unavailable). */
      (function () {
        var link = document.getElementById("galleryLink");
        var candidates = ["./index.html", "../index.html", "../../index.html", "../../../index.html"];
        (function probe(index) {
          if (index >= candidates.length) return;
          var url = new URL(candidates[index], window.location.href);
          fetch(url.href, { method: "GET" })
            .then(function (response) {
              if (response.ok) link.setAttribute("href", candidates[index]);
              else probe(index + 1);
            })
            .catch(function () {
              probe(index + 1);
            });
        })(0);
      })();
    </script>
  </body>
</html>
