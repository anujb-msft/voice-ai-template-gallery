name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate and generate catalogue
        run: node scripts/generate-template-index.js

      - name: Verify generated data is current
        run: git diff --exit-code -- docs/data

  password-reset-demo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/templates/it-helpdesk-password-reset/code
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/templates/it-helpdesk-password-reset/code/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check server syntax
        run: npm run check

  call-routing-demo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/templates/intent-based-call-routing/code
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The routing state machine, the route policy and the Teams handoff import
      # nothing outside the standard library, so the tests that cover them run
      # before any dependency is installed. If this step ever needs npm ci, a
      # transport concern has leaked into the policy layer.
      - name: Test the routing policy without dependencies
        run: npm test

      - name: Install dependencies
        run: npm ci

      - name: Check server syntax
        run: npm run check

      # The unit suite is dependency-free by design, so it cannot see transport
      # faults. This boots the server and checks both WebSocket endpoints accept
      # an upgrade — they once did not, and the only symptom was a connected call
      # sitting in silence with "MediaStreamingFailed" in the ACS callback.
      - name: Smoke test the WebSocket endpoints
        run: npm run smoke
