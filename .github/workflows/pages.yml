name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate template index
        run: node scripts/generate-template-index.js
        env:
          INCLUDE_REPOSITORY_METADATA: "1"

      # Demo films live on the demo-films release, which serves them as
      # attachments that Safari on iPhone may refuse to play. Copy them into
      # the site so the players can use the same origin first. This runs after
      # the generator, which rejects a hosted film that is also on disk.
      - name: Mirror hosted films into the site
        run: node scripts/mirror-hosted-films.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
